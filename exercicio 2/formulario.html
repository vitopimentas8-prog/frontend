<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #222;
            line-height: 1.6;
        }
        header {
            background: #14213d;
            color: white;
            text-align: center;
            padding: 25px;
        }
        main {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }
        h2 { color: #0077b6; }
        .campo { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font: inherit;
        }
        textarea { resize: vertical; }
        button {
            background: #0077b6;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #005f91; }
        .voltar { display: inline-block; margin-top: 18px; color: #005f91; }
        footer {
            background: #14213d;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Formulário de Contato</h1>
        <p>Envie sua dúvida ou mensagem</p>
    </header>

    <main>
        <h2>Entre em contato</h2>
        <form action="#" method="get">
            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="campo">
                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione um assunto</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="suporte">Suporte técnico</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>
            </div>

            <button type="submit">Enviar mensagem</button>
        </form>

        <a class="voltar" href="index.html">Voltar para a página inicial</a>
    </main>

    <footer>
        <p>&copy; 2026 - Tecnologia e Informática | Formulário de contato</p>
    </footer>
</body>
</html>
